[package]
name = "Hugvi"
version = "1.3.4"
description = "A code note-taking app."
authors = ["Cyprien"]
edition = "2021"


[lib]
name = "hugvi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-opener = "2.5.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"] }
tauri-plugin-dialog = "2.8.3"
reqwest = { version = "0.13.5", features = ["json"] }
tokio = { version = "1", features = ["full"] }
